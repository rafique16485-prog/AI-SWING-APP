<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Hunter AI • Multi-Timeframe</title><style>body{margin:0;background:#050b14;color:#eaf2ff;font-family:system-ui}.wrap{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:22px;font-weight:800}.brand span{color:#22c55e}.badge,.pill{border:1px solid #24516c;border-radius:999px;padding:7px 10px;color:#9fb4ca;font-size:11px}.hero,.card{background:#0b1422;border:1px solid #1b2a3d;border-radius:18px;padding:16px;margin:14px 0}.controls{display:flex;gap:9px}.input,.btn{background:#09121e;color:#eaf2ff;border:1px solid #1b2a3d;border-radius:11px;padding:12px}.btn{cursor:pointer}.primary{background:#12351f;color:#86efac}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #142236}.good{color:#4ade80}.bad{color:#fb7185}.wait{color:#fcd34d}.muted{color:#8ea0b8;font-size:12px}.decision{font-size:28px;font-weight:900;text-align:center;padding:18px}.tf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tf div{background:#09121e;border:1px solid #1b2a3d;border-radius:12px;padding:12px;text-align:center}.notice{padding:10px;background:#211a08;color:#fcd34d;border-radius:10px;font-size:11px;margin-top:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}.tf{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">⚡ SWING <span>HUNTER AI</span></div><div class="muted">Multi-Timeframe Price Action Engine</div></div><div class="badge">DAILY • 1H • 15M • 5M</div></div><div class="hero"><h2>🎯 Swing Setup Decoder</h2><div class="muted">Higher timeframe direction → 15M setup → 5M entry confirmation.</div></div><div class="controls"><input id="symbol" class="input" placeholder="Symbol e.g. BHARTIARTL"><input id="key" class="input" placeholder="Upstox instrument key"><button id="run" class="btn primary">Analyse</button></div><div id="status" class="muted" style="margin:12px 0">Enter an instrument key from the live radar.</div><div id="out"></div></div><script>const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(label,v){return `<div class="metric"><span>${label}</span><b>${esc(v)}</b></div>`}function render(d){const dec=d.final_decision;const cls=dec==='WAIT'?'wait':dec.includes('LONG')?'good':'bad';$('out').innerHTML=`<div class="card"><div class="decision ${cls}">${esc(dec)}</div><div class="tf"><div><b>DAILY</b><br>${esc(d.daily.structure)}<br><span class="muted">${esc(d.daily.bos)}</span></div><div><b>1H</b><br>${esc(d.hourly.structure)}<br><span class="muted">${esc(d.hourly.bos)}</span></div><div><b>15M</b><br>${esc(d.m15.setup)}<br><span class="muted">${esc(d.m15.confirmation)}</span></div><div><b>5M</b><br>${esc(d.m5.structure)}<br><span class="muted">${esc(d.m5.confirmation)}</span></div></div></div><div class="grid"><div class="card"><h3>📊 Structure</h3>${card('Swing Score',d.score+'/100')}${card('Market Structure',d.market_structure)}${card('Bias',d.bias)}${card('Confidence',d.confidence)}${card('Risk / Reward',d.risk_reward)}</div><div class="card"><h3>🎯 Trade Levels</h3>${card('Entry',d.entry)}${card('Stop Loss',d.stop_loss)}${card('Target 1',d.target1)}${card('Target 2',d.target2)}<div class="notice">WAIT means the required multi-timeframe confirmation is not present. Do not treat a momentum score as a buy signal.</div></div></div><div class="card"><h3>🔎 Data Check</h3>${card('Daily candles',d.data_available.daily)}${card('1H candles',d.data_available.hourly)}${card('15M candles',d.data_available.m15)}${card('5M candles',d.data_available.m5)}</div>`}async function run(){const key=$('key').value.trim(),sym=$('symbol').value.trim().toUpperCase();if(!key){$('status').textContent='Instrument key required.';return}$('status').textContent='Fetching real Upstox candles…';$('out').innerHTML='';try{const r=await fetch('/api/swing-analysis?instrument_key='+encodeURIComponent(key)+'&symbol='+encodeURIComponent(sym),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Analysis failed');render(d);$('status').textContent='Updated: '+new Date(d.updated_at_utc).toLocaleString('en-IN')}catch(e){$('status').textContent='Error: '+e.message}}$('run').onclick=run;</script></body></html>

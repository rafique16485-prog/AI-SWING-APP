<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Hunter AI — Dynamic Top 3</title><style>body{margin:0;background:#050b14;color:#eaf2ff;font-family:system-ui;padding:16px}.wrap{max-width:980px;margin:auto}.hero,.card{background:#0b1422;border:1px solid #1b2a3d;border-radius:16px;padding:16px;margin-bottom:12px}.hero h1{margin:0 0 6px;font-size:22px}.muted{color:#8ea0b8;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rank{color:#7dd3fc;font-weight:900}.score{font-size:38px;font-weight:950;margin:8px 0}.status{display:inline-block;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:900}.wait{background:#322b0d;color:#fcd34d}.ready{background:#12351f;color:#86efac}.no{background:#2b1820;color:#fda4af}.row{display:flex;justify-content:space-between;border-bottom:1px solid #142236;padding:9px 0;font-size:12px}.row span{color:#8ea0b8}.rule{margin-top:12px;color:#8ea0b8;font-size:11px;line-height:1.5}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.refresh{background:#12351f;color:#86efac;border:1px solid #246c3b;border-radius:9px;padding:8px 11px;font-weight:800}.error{color:#fda4af;background:#2b1820;padding:10px;border-radius:9px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><div class="topline"><div><h1>🏆 TOP 3 SWING HUNTER</h1><div class="muted">LIVE SNAPSHOT • Breakout → Retest → Entry</div></div><button class="refresh" onclick="load()">↻ Refresh</button></div><div id="meta" class="muted" style="margin-top:10px">Loading latest scan…</div><div id="err"></div></div><div id="grid" class="grid"></div><div class="hero rule">⚠️ Rule: NO CHASE. High score ≠ immediate entry. 🟢 Entry Ready only after confirmation; otherwise 🟡 Wait for Retest. Verify current price/volume with your broker before trading.</div></div><script>function money(x){return x==null?'—':'₹'+Number(x).toLocaleString('en-IN',{maximumFractionDigits:2})}function statusClass(s){return String(s).includes('READY')?'ready':String(s).includes('NO CHASE')?'no':'wait'}function statusText(s){if(s==='BREAKOUT WATCH')return '🟡 WAIT FOR RETEST';if(s==='MOMENTUM WATCH')return '🟡 WAIT';if(s==='NO CHASE')return '🔴 NO CHASE';return s||'🟡 WAIT'}function card(x,i){return `<div class="card"><div class="rank">#${i+1} ${x.s||x.symbol}</div><div class="score">${x.score??'—'}</div><div class="status ${statusClass(x.status)}">${statusText(x.status)}</div><div class="row"><span>Current</span><b>${money(x.p)}</b></div><div class="row"><span>Entry trigger</span><b>${money(x.res)} + hold</b></div><div class="row"><span>SL</span><b>${money(x.sup)}</b></div><div class="row"><span>T1</span><b>${money(x.target1)}</b></div><div class="row"><span>T2</span><b>${money(x.target2)}</b></div><div class="row"><span>Move</span><b>${x.m!=null?x.m+'%':'—'}</b></div><div class="row"><span>Volume</span><b>${x.v!=null?x.v+'×':'—'}</b></div><div class="row"><span>R:R</span><b>${x.rr1!=null?'1:'+Number(x.rr1).toFixed(1):'—'} / ${x.rr2!=null?'1:'+Number(x.rr2).toFixed(1):'—'}</b></div></div>`}async function load(){const err=document.getElementById('err');err.innerHTML='';document.getElementById('meta').textContent='Loading latest scan…';try{const r=await fetch('market_data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Market snapshot unavailable');const d=await r.json();const all=Array.isArray(d.stocks)?d.stocks:[];const a=all.filter(x=>!x.no_chase).sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)).slice(0,3);document.getElementById('grid').innerHTML=a.length?a.map(card).join(''):'<div class="card">No qualified Top 3 setup right now. 🟡 WAIT</div>';const stamp=d.updated_utc||'unknown';const count=d.candidates_scanned??all.length;document.getElementById('meta').textContent=`Latest scan: ${stamp} • ${count} candidates • Top 3 excludes NO CHASE`;}catch(e){document.getElementById('meta').textContent='Latest scan unavailable';err.innerHTML='<div class="error">Could not load latest market snapshot. Please refresh after the next successful scan.</div>';document.getElementById('grid').innerHTML=''}}load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Hunter AI — Trade Journal</title><style>body{margin:0;background:#050b14;color:#eaf2ff;font-family:system-ui;padding:16px}.wrap{max-width:900px;margin:auto}.hero,.card{background:#0b1422;border:1px solid #1b2a3d;border-radius:16px;padding:16px;margin-bottom:12px}.hero h1{margin:0 0 6px}.muted{color:#8ea0b8;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#08111d;border:1px solid #1b2a3d;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:#8ea0b8;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;background:#08111d;color:#eaf2ff;border:1px solid #26384f;border-radius:9px;padding:11px}.btn{background:#12351f;color:#86efac;border:1px solid #246c3b;border-radius:9px;padding:11px 15px;font-weight:800}.danger{background:#2b1820;color:#fda4af;border-color:#63303d}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #142236;padding:10px 0;font-size:12px}.profit{color:#86efac}.loss{color:#fda4af}.table{overflow:auto}.trade{min-width:650px}.small{font-size:11px;color:#8ea0b8}.actions{display:flex;gap:8px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>📒 TRADE JOURNAL</h1><div class="muted">Record every trade • automatic P&L • win rate • risk discipline</div></div><div class="grid"><div class="stat">Trades<b id="count">0</b></div><div class="stat">Wins<b id="wins">0</b></div><div class="stat">Win Rate<b id="rate">0%</b></div><div class="stat">Net P&L<b id="net">₹0</b></div></div><div class="card"><h2>➕ Add Trade</h2><div class="form"><div class="field"><label>Stock</label><input id="symbol" placeholder="PNB"></div><div class="field"><label>Side</label><select id="side"><option>LONG</option><option>SHORT</option></select></div><div class="field"><label>Entry Price</label><input id="entry" type="number" step="0.01"></div><div class="field"><label>Exit Price</label><input id="exit" type="number" step="0.01"></div><div class="field"><label>Quantity</label><input id="qty" type="number" step="1" value="1"></div><div class="field"><label>Stop Loss</label><input id="sl" type="number" step="0.01"></div><div class="field"><label>Setup Score</label><input id="score" type="number" step="1" placeholder="92"></div><div class="field"><label>Notes</label><input id="notes" placeholder="Retest + hold / reason"></div></div><div class="actions"><button class="btn" onclick="addTrade()">Save Trade</button><button class="btn danger" onclick="clearAll()">Clear Journal</button></div><div id="msg" class="small" style="margin-top:8px"></div></div><div class="card"><h2>📊 Trade History</h2><div id="history"></div></div><div class="hero muted">⚠️ Journal is stored in this browser/device using local storage. P&L is a planning/recording tool; verify actual broker fills, charges and taxes.</div></div><script>const KEY='swingHunterTradeJournalV1';function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function addTrade(){const s=document.getElementById('symbol').value.trim().toUpperCase(),side=document.getElementById('side').value,e=Number(document.getElementById('entry').value),x=Number(document.getElementById('exit').value),q=Number(document.getElementById('qty').value),sl=Number(document.getElementById('sl').value||0),score=Number(document.getElementById('score').value||0),notes=document.getElementById('notes').value.trim();if(!s||!e||!x||!q){document.getElementById('msg').textContent='Stock, entry, exit and quantity required.';return}const pnl=(side==='LONG'?(x-e):(e-x))*q;const risk=sl?Math.abs(e-sl)*q:0;const a=get();a.unshift({id:Date.now(),date:new Date().toLocaleString('en-IN'),s,side,e,x,q,sl,score,notes,pnl,risk});save(a);['symbol','entry','exit','qty','sl','score','notes'].forEach(id=>document.getElementById(id).value=id==='qty'?1:'');document.getElementById('msg').textContent='Trade saved ✅';render()}function delTrade(id){save(get().filter(t=>t.id!==id));render()}function clearAll(){if(confirm('Delete all journal trades?')){save([]);render()}}function render(){const a=get(),wins=a.filter(t=>t.pnl>0).length,net=a.reduce((z,t)=>z+t.pnl,0);document.getElementById('count').textContent=a.length;document.getElementById('wins').textContent=wins;document.getElementById('rate').textContent=(a.length?(wins/a.length*100).toFixed(0):0)+'%';const n=document.getElementById('net');n.textContent=money(net);n.className=net>=0?'profit':'loss';document.getElementById('history').innerHTML=a.length?a.map(t=>`<div class="card trade"><div class="row"><b>${t.s} • ${t.side}</b><b class="${t.pnl>=0?'profit':'loss'}">${t.pnl>=0?'+':''}${money(t.pnl)}</b></div><div class="row"><span>Date</span><b>${t.date}</b></div><div class="row"><span>Entry → Exit</span><b>${money(t.e)} → ${money(t.x)}</b></div><div class="row"><span>Qty / SL</span><b>${t.q} / ${t.sl?money(t.sl):'—'}</b></div><div class="row"><span>Score / Risk</span><b>${t.score||'—'} / ${t.risk?money(t.risk):'—'}</b></div>${t.notes?`<div class="small" style="margin-top:8px">📝 ${t.notes}</div>`:''}<div class="actions"><button class="btn danger" onclick="delTrade(${t.id})">Delete</button></div></div>`).join(''):'<div class="muted">No trades yet. Record the first trade after your setup is confirmed.</div>'}render();</script></body></html>

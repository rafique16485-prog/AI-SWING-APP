name: Swing Hunter Market Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 3-10 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: pip install --disable-pip-version-check pandas yfinance

      - name: Scan market
        run: python -u scripts/update_market_data.py

      - name: Commit market snapshot
        run: |
          git config user.name "swing-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html market_data.json
          git diff --cached --quiet || git commit -m "Update Swing Hunter market snapshot"
          git push
